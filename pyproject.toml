[tool.poetry]
name = "pythonproject"
version = "0.1.0"
description = ""
authors = ["Olesya <flomaster597@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
flake8 = "^7.3.0"
package-name = "^0.1"
requests = "^2.34.2"
python-dotenv = "^1.2.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
[tool.black]
line-length = 119

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "src"
